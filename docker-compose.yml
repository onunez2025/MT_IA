# docker-compose.yml
# Uso LOCAL: carga variables desde backend/.env
# EasyPanel: ignorar este archivo — variables se configuran en la UI de EasyPanel
version: "3.9"

services:
  sole-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sole-ai:local
    container_name: sole-ai-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
